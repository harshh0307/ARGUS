services:
  argus:
    build: .
    image: argus:local
    env_file:
      # Optional so the suite and one-shot commands run on a fresh clone,
      # before anyone has copied .env.example to .env.
      - path: .env
        required: false
    volumes:
      - ./repos:/repos:ro
    command: ["scan", "/repos"]

  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Exactly one process runs migrations; every other service waits for it to
  # finish rather than racing to create the schema itself.
  migrate:
    build: .
    image: argus:local
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    env_file:
      # Optional so the suite and one-shot commands run on a fresh clone,
      # before anyone has copied .env.example to .env.
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    restart: unless-stopped
    build: .
    image: argus:local
    entrypoint: ["celery", "-A", "app.workers.celery_app"]
    env_file:
      # Optional so the suite and one-shot commands run on a fresh clone,
      # before anyone has copied .env.example to .env.
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["worker", "--loglevel=info"]

  beat:
    restart: unless-stopped
    build: .
    image: argus:local
    entrypoint: ["celery", "-A", "app.workers.celery_app"]
    working_dir: /tmp
    env_file:
      # Optional so the suite and one-shot commands run on a fresh clone,
      # before anyone has copied .env.example to .env.
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["beat", "--loglevel=info"]

  api:
    restart: unless-stopped
    build: .
    image: argus:local
    entrypoint: ["uvicorn", "app.api.main:app"]
    env_file:
      # Optional so the suite and one-shot commands run on a fresh clone,
      # before anyone has copied .env.example to .env.
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    command: ["--host", "0.0.0.0", "--port", "8000"]

  api-dev:
    build: .
    image: argus:local
    entrypoint: ["uvicorn", "app.api.main:app"]
    env_file:
      # Optional so the suite and one-shot commands run on a fresh clone,
      # before anyone has copied .env.example to .env.
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    command: ["--host", "0.0.0.0", "--port", "8000", "--reload"]

  test:
    build:
      context: .
      target: dev
    image: argus:dev
    # The image ENTRYPOINT is ["argus"], so without this the command below
    # becomes `argus python -m pytest ...` and argparse rejects it.
    entrypoint: []
    env_file:
      # Optional so the suite and one-shot commands run on a fresh clone,
      # before anyone has copied .env.example to .env.
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # The suite must not depend on real credentials. A few tests exercise
      # credential *resolution* and fail if nothing is configured at all, so
      # supply a placeholder unless the caller overrides it.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-dummy-token-for-tests}
    command: ["python", "-m", "pytest", "tests", "-q", "--tb=short"]
    volumes:
      - ./tests:/app/tests

  dashboard:
    build:
      context: ./web
      dockerfile: ../Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
