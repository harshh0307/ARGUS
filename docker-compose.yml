services:
  argus:
    build: .
    image: argus:local
    env_file: .env
    volumes:
      - ./repos:/repos:ro
    command: ["scan", "/repos"]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  worker:
    build: .
    image: argus:local
    entrypoint: ["celery", "-A", "app.workers.celery_app"]
    env_file: .env
    depends_on:
      - postgres
      - redis
    command: ["worker", "--loglevel=info"]

  beat:
    build: .
    image: argus:local
    entrypoint: ["celery", "-A", "app.workers.celery_app"]
    working_dir: /tmp
    env_file: .env
    depends_on:
      - postgres
      - redis
    command: ["beat", "--loglevel=info"]

  api:
    build: .
    image: argus:local
    entrypoint: ["uvicorn", "app.api.main:app"]
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    command: ["--host", "0.0.0.0", "--port", "8000"]

volumes:
  pgdata: