services:
  argus:
    build: .
    image: argus:local
    env_file: .env
    volumes:
      - ./repos:/repos:ro
    command: ["scan", "/repos"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: