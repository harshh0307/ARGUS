name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "infra/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: argus-dev
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pytest -q

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check AWS secrets configured
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ] || [ -z "$TF_STATE_BUCKET" ]; then
            echo "DEPLOY_ENABLED=false" >> "$GITHUB_ENV"
            echo "::notice::Skipping AWS deployment: set AWS_DEPLOY_ROLE_ARN and TF_STATE_BUCKET secrets (run scripts/aws/bootstrap.ps1) to enable the production ECS deployment."
          fi
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}

      - uses: actions/checkout@v4
        if: ${{ env.DEPLOY_ENABLED != 'false' }}

      - name: Assume AWS role via GitHub OIDC
        if: ${{ env.DEPLOY_ENABLED != 'false' }}
        run: |
          set -euo pipefail
          id_token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          creds=$(aws sts assume-role-with-web-identity \
            --role-arn "$AWS_DEPLOY_ROLE_ARN" \
            --role-session-name "github-actions-$GITHUB_RUN_ID" \
            --web-identity-token "$id_token" \
            --query 'Credentials' --output json)
          echo "AWS_ACCESS_KEY_ID=$(echo "$creds" | jq -r .AccessKeyId)" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$(echo "$creds" | jq -r .SecretAccessKey)" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$(echo "$creds" | jq -r .SessionToken)" >> "$GITHUB_ENV"
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Login to Amazon ECR
        if: ${{ env.DEPLOY_ENABLED != 'false' }}
        run: |
          registry=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $registry
          echo "REGISTRY=$registry" >> "$GITHUB_ENV"

      - name: Build, tag, and push image
        if: ${{ env.DEPLOY_ENABLED != 'false' }}
        run: |
          docker build -t $REGISTRY/$ECR_REPO:$IMAGE_TAG .
          docker tag $REGISTRY/$ECR_REPO:$IMAGE_TAG $REGISTRY/$ECR_REPO:latest
          docker push $REGISTRY/$ECR_REPO:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPO:latest

      - name: Setup Terraform
        if: ${{ env.DEPLOY_ENABLED != 'false' }}
        run: |
          curl -fsSL -o /tmp/tf.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
          sudo unzip -o /tmp/tf.zip -d /usr/local/bin

      - name: Terraform apply
        if: ${{ env.DEPLOY_ENABLED != 'false' }}
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=argus/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform apply -auto-approve -var="image_tag=$IMAGE_TAG"
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}

      - name: Force new ECS deployment
        if: ${{ env.DEPLOY_ENABLED != 'false' }}
        run: |
          aws ecs update-service --cluster argus-dev --service argus-dev-api --force-new-deployment
          aws ecs update-service --cluster argus-dev --service argus-dev-worker --force-new-deployment
          aws ecs update-service --cluster argus-dev --service argus-dev-beat --force-new-deployment
