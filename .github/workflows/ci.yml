name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests migrations

      - name: Pytest
        env:
          # A few tests exercise credential *resolution* and fail if nothing is
          # configured at all. No real access is needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || 'dummy-token-for-tests' }}
        run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Install Terraform
        run: |
          curl -fsSL -o /tmp/tf.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
          sudo unzip -o /tmp/tf.zip -d /usr/local/bin

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
